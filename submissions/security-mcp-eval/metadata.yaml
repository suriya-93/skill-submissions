name: security-mcp-eval
description: >-
  Security MCP pilot: 25 cases mapped from Lightforge datasets/security/scenarios.yaml.
  Stage Compass push enabled for evaluation gate (trial).
version: 0.1.0
eval_engine: mcpchecker
mcp:
  credentials_secret: security-mcp-credentials
agent_timeout_sec: 300
gate_policy:
  default_mode: warn
  combination: all_pass
  push_facts:
    endpoint: https://compass.stage.redhat.com/api/soundcheck/facts/
    entity_ref: mcpserver:redhat/security-mcp-server
    fact_ref_prefix: "abevalflow:"
    bearer_token: ${COMPASS_API_TOKEN}
  gates:
    evaluation:
      mode: warn
      push_fact: true
